; PlatformIO Project Configuration File for CO2-Ampel Pro NG
;
; Documentation: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = co2ampel_pro

[env]
; Common settings for all environments
platform = atmelsam@9.0.0
framework = arduino
monitor_speed = 9600
monitor_filters = direct
; Custom sam-ba upload: reliable bootloader handshake, settings area is read back and re-flashed
upload_protocol = custom
extra_scripts = pre:scripts/upload_samba.py, pre:scripts/link_debug.py, pre:scripts/wifi_send_guard.py
platform_packages = platformio/tool-bossac@~1.10700.0
lib_ldf_mode = deep+

; Custom board and variant paths
board_build.variants_dir = variants

; Common library dependencies
lib_deps =
    Wire
    SPI
    sensirion/Sensirion Core@^0.7.3
    sensirion/Sensirion I2C SCD30@^1.1.1
    sensirion/Sensirion I2C SCD4x@^1.1.0
    adafruit/Adafruit BMP280 Library@^3.0.0
    arduino-libraries/Arduino_LPS22HB@^1.0.3
    adafruit/Adafruit NeoPixel@^1.15.5
    arduino-libraries/WiFi101@^0.16.1
    adafruit/Adafruit BusIO@^1.15.0
    adafruit/Adafruit Unified Sensor@^1.1.14
    256dpi/MQTT@^2.5.3
    ; 5.0.1, not 6.x: 6.0.1 keeps the session keys in a "secure element" with no setter, so a kept session
    ; (lora_service.cpp) can't be restored there
    mcci-catena/MCCI LoRaWAN LMIC library@5.0.1

; Build flags common to all environments
build_flags =
    -DVERSION=\"0.10\"
    -DUSBCON
    ; Link time optimization: ~15 KB smaller image. The core's vector table has no
    ; "used" attribute, LTO would drop it (app does not start) -> keep it explicitly
    -flto
    -Wl,-u,exception_table
    ; Debug info in firmware.elf only (image unchanged): addr2line for the hang/fault address (diag last_pc),
    ; the link needs it too (scripts/link_debug.py)
    -g
    ; LoRaWAN (lora_service.cpp): EU868, RFM95 = SX1276, Class A only, no project config file
    -DARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
    -DCFG_eu868=1
    -DCFG_sx1276_radio=1
    -DDISABLE_PING
    -DDISABLE_BEACONS
    -DLMIC_ENABLE_DeviceTimeReq=0
    -DLMIC_ENABLE_onEvent=0
    -DLMIC_ENABLE_long_messages=0
    -DLMIC_ENABLE_arbitrary_clock_error=1
    -DLMIC_DEBUG_LEVEL=0

; ============================================================
; CO2-Ampel Pro - Default Configuration
; Hardware: WiFi (WINC1500) + Pressure Sensor (BMP280/LPS22HB)
; All CO2 thresholds and LED colors configurable via serial
; ============================================================
[env:co2ampel_pro]
board = co2ampel
board_build.ldscript = variants/co2ampel/linker_scripts/gcc/flash_with_bootloader.ld

; ============================================================
; Host unit tests (no hardware): pio test -e native
; ============================================================
[env:native]
platform = native
framework =
extra_scripts =
platform_packages =
upload_protocol =
lib_deps =
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<json_parser.cpp> +<serial_settings.cpp> +<settings_registry.cpp> +<settings_storage.cpp> +<calibration.cpp> +<errors.cpp>
build_flags =
    -std=gnu++11
    -Itest/stubs
    -DVERSION=\"test\"
