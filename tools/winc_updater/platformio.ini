; WINC1500 flash access for the CO2-Ampel (FirmwareUpdater sketch from WiFi101, unchanged).
; Used by scripts/winc_rootcert.py to manage the TLS root certificates in the WiFi module.
;   pio run -d tools/winc_updater -t upload     (settings in the MCU flash are kept)
; Afterwards flash the CO2-Ampel firmware again: pio run -e co2ampel_pro -t upload

[platformio]
boards_dir = ../../boards

[env:winc_updater]
platform = atmelsam@9.0.0
framework = arduino
board = co2ampel
board_build.variants_dir = ../../variants
board_build.ldscript = ../../variants/co2ampel/linker_scripts/gcc/flash_with_bootloader.ld
upload_protocol = custom
extra_scripts = pre:../../scripts/upload_samba.py
platform_packages = platformio/tool-bossac@~1.10700.0
build_flags = -DUSBCON
lib_deps = arduino-libraries/WiFi101@^0.16.1
